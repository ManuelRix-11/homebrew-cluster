name: Test Cask

on:
  push:
    paths:
      - "Casks/cluster.rb"
      - ".github/workflows/test-cask.yml"
  pull_request:
    paths:
      - "Casks/cluster.rb"
      - ".github/workflows/test-cask.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tappa il repo locale invece di clonare da GitHub
      # così testiamo sempre la versione corrente del Cask
      - name: Tap this repo (local)
        run: brew tap ManuelRix-11/cluster "${{ github.workspace }}"

      - name: Install cask
        run: brew install --cask ManuelRix-11/cluster/cluster

      - name: Verify app installed
        run: |
          if [ -d "/Applications/Cluster.app" ]; then
            echo "✅ Cluster.app trovata in /Applications"
          else
            echo "❌ Cluster.app NON trovata in /Applications"
            exit 1
          fi

      - name: Verify quarantine removed
        run: |
          attrs=$(xattr /Applications/Cluster.app 2>/dev/null || true)
          if echo "$attrs" | grep -q "com.apple.quarantine"; then
            echo "❌ quarantine attribute ancora presente"
            exit 1
          else
            echo "✅ quarantine attribute rimosso correttamente"
          fi

      - name: Verify app signature
        run: |
          codesign -vvv --deep --strict /Applications/Cluster.app
          echo "✅ Firma ad-hoc valida e verificata"

      - name: Test launch Cluster.app (Gatekeeper & execution check)
        run: |
          echo "🚀 Avvio Cluster.app tramite macOS LaunchServices..."
          open -a "/Applications/Cluster.app"

          # Attesa per consentire a Gatekeeper e LaunchServices di intervenire
          sleep 5

          # 1. Verifica che Gatekeeper non abbia rimosso l'app
          if [ ! -d "/Applications/Cluster.app" ]; then
            echo "❌ Gatekeeper ha rimosso l'app o l'ha bloccata!"
            exit 1
          fi

          # 2. Verifica se l'app è finita nel Cestino
          if [ -d "$HOME/.Trash/Cluster.app" ]; then
            echo "❌ Cluster.app è stata spostata nel Cestino da macOS!"
            exit 1
          fi

          # 3. Verifica presenza processo attivo
          if pgrep -f "Cluster" > /dev/null; then
            echo "✅ Cluster.app è stata avviata con successo e il processo è attivo!"
            pkill -f "Cluster" || true
          else
            echo "ℹ️ Processo terminato (ambiente headless), test di esecuzione diretta del binario:"
            /Applications/Cluster.app/Contents/MacOS/Cluster --version || true
            echo "✅ Esecuzione binario completata senza blocchi del kernel"
          fi
